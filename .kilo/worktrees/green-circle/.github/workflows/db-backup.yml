name: Daily DB Backup

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Dump database
        run: docker run --rm postgres:18 pg_dump "$DATABASE_URL" --no-owner --no-acl > backup.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sanity check
        run: |
          SIZE=$(stat -c%s backup.sql)
          echo "backup size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then echo "backup too small, aborting"; exit 1; fi

      - name: Compress
        run: gzip backup.sql && mv backup.sql.gz "backup-$(date +%Y%m%d-%H%M%S).sql.gz"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup-${{ github.run_id }}
          name: Daily Backup ${{ github.run_id }}
          files: backup-*.sql.gz

      - name: Keep only newest 30 backups, delete older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep '^backup-' | sort | head -n -30 | while read -r t; do
            echo "deleting old release: $t"
            gh release delete "$t" --yes || true
          done